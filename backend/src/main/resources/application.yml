server:
  port: 8080
spring:
  application:
    name: careerpilot
  datasource:
    # Default = file-based H2 so the app runs with zero setup. Docker/Postgres overrides via env vars.
    url: ${DB_URL:jdbc:h2:file:./data/careerpilot;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
careerpilot:
  jwt:
    secret: ${JWT_SECRET:careerpilot-dev-secret-change-me-use-at-least-32-bytes}
    expiration-minutes: 720
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  seed:
    enabled: ${SEED_ENABLED:true}
